#    plugin: get
#    source: commerce_customer_billing_profile_id
  order_items:
    plugin: migration_lookup
    migration: bg_order_item
    source: commerce_line_items

  cart:
    plugin: static_map
    source: status
    default_value: false
    map:
      cart: true
  created: created
  changed: changed
  # Set the placed time only if not draft or cancelled.
  placed:
    -
      plugin: skip_on_value
      method: process
      source: '@state'
      value:
        - draft
        - cancelled
    -
      plugin: get
      source: created
  # Set the completed time only if completed
  completed:
    -
      plugin: skip_on_value
      method: process
      not_equals: true
      source: '@state'
      value: completed
    -
      plugin: get
      source: changed
  mail: mail
  payment_method:
    plugin: get
    source: payment_method
  payment_gateway  :
    plugin: default_value
    default_value: 'authorize'
  # Do not refresh the order during migration.
  data/refresh_state: refresh_state
  store_id:
    plugin: default_value
    source: default_store_id
    default_value: 1
#  adjustments:
