id: bg_commerce_order
label: Commerce order
migration_tags:
  - Drupal 7
  - Commerce
  - Content
#class: Drupal\bg_import_orders\Plugin\migrate\Order
source:
  plugin: bg_commerce_order
process:
  # If you are using this file to build a custom migration consider removing
  # the order_id field to allow incremental migrations.
  order_id: order_id
  order_number: order_number
  revision_id: revision_id
  type: type
  billing_period/starts:
    plugin: get
    source: start
  billing_period/ends:
    plugin: get
    source: end
#    plugin: static_map
#    source: type
#    default_value: default
#    map:
#      commerce_order: default
  uid: uid
  ip_address: hostname
  state: status
  total_price: total


  billing_profile/target_id:
    plugin: get
    source:  commerce_customer_billing_profile_id
  billing_profile/target_revision_id:
    plugin: get
    source: commerce_customer_billing_profile_id


