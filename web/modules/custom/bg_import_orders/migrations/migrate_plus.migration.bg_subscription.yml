id: bg_subscription
label: Commerce subscription
migration_tags:
  - Drupal 7
  - Commerce
  - Content
source:
  plugin: bg_subscription
process:
  title : product_title
  subscription_id:
    plugin: get
    source: license_id
  type:
    plugin: default_value
    default_value: 'product_variation'
  uid : uid
  store_id:
    plugin: default_value
    default_value: '1'
  billing_schedule:
    plugin: get
    source: billing_schedule
  payment_method:
    plugin: get
    source: payment_method
  purchased_entity:
    plugin: static_map
    source: product_id
    map:
      11: 3 #BGPRM-MI
      77: 7 #LUPRM-MI
      70: 8 #LUPRM-YI
      220: 3 #BGPNG-WELL-AP-Dv2
      131: 4 #LUPNG-V4AP-SITE
      81: 5 #LUPNG-V4AP
      218: 3 #BGPNG-WELL-APv2
      80: 6 #LUPNG-V4GA
      68: 9 #LUPRM-YT
      67: 10 #LUPRM-YT-20
      117: 11 #LUPRM-YT-30

  unit_price: unit_price
  state:
    plugin: default_value
    default_value: 'active'
  initial_order : initial_order
  created: granted
  changed: granted
  next_renewal: expires
  starts: granted
  orders/target_id: originating_order


destination:
  plugin: 'entity:commerce_subscription'
  destination_module: commerce_subscription
