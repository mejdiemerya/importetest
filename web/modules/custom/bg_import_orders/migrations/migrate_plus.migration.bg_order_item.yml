id: bg_order_item
label: Commerce order item
deriver: Drupal\commerce_migrate_commerce\Plugin\migrate\OrderItemDeriver
migration_tags:
  - Drupal 7
  - Commerce
  - Content
source:
  plugin: bg_line_item
process:
  order_item_id: line_item_id
  revision_id: revision_id
  type:
    plugin: static_map
    source: status
    map:
      invoiced: default
      recurring_open: recurring_product_variation
#    plugin: static_map
#    source: type
#    map:
#      product: default
#      recurring: recurring_product_variation
  uid: uid
  order_id: order_id
  status: status
  created: created
  changed: changed
  title: title_product
  unit_price: unit_price
  total_price: total
  billing_period/starts:
    plugin: get
    source: formatted_time_start
  billing_period/ends:
    plugin: get
    source: formatted_time_end
  license/bundle:
    plugin: default_value
    default_value: default
  license/target_id:
    plugin: get
    source: cl_billing_license_target_id
  subscription/target_id:
    - plugin: get
      source: cl_billing_license_target_id
#    - plugin: debug
