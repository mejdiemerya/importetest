#    default_value: 'USD'
#  total_price/currency_code:
#    plugin: default_value
#    default_value: 'USD'
#  'field_order_items/entity_id':
#    plugin: get
#    source: order_id
#  'field_order_items/target_id':
#    plugin: get
#    source: line_item_id
#  order_items:
#    plugin: 'default_value'  # Plugin pour gérer la valeur par défaut
#    source: 'commerce_line_items'  # Source du champ texte
#    default_value: '@source.commerce_line_items'
#  order_items:
#    plugin: '@MigrateField'  # Utilisation du plugin @MigrateField
#    source: 'commerce_line_items'  # Le champ texte à migrer
#    entity_type: 'commerce_order_item'  # L'entité cible, ici un node
#    field_name: 'order_items'  # Le champ Drupal où migrer le texte
#    language: 'und'  # Langue du champ (par défaut 'und' pour inconnu)
#    field_name: 'order_items'  # Nom du champ personnalisé dans Drupal
#    language: 'und'  # La langue pour le champ (ici 'und' pour inconnu)
#  order_items:
#    plugin: migration_lookup
#    migration: bg_order_item
#    source: bg_line_item_reference
  purchased_entity:
    plugin: static_map
#    bypass: true
    source: line_item_label
    map:
      BGPRM-MI: 3
      LUPRM-MI: 10
#      LUPNW-LDSW: 13
      LUPRM-YI: 11
      BGPNG-WELL-AP-Dv2: 3
      LUPNG-V4AP-SITE: 6
      LUPNG-V4AP: 7
      BGPNG-WELL-APv2: 8
      LUPNG-V4GA: 9
      LUPRM-YT: 12
      LUPRM-YT-20: 13
      LUPRM-YT-30: 14
#    plugin: migration_lookup
#    migration: commerce1_product_variation
#    source: commerce_product
  quantity: quantity
  adjustments:
    -
      plugin: commerce1_order_item_discount_adjustment
      source: order_components/0/data/components
    -
      plugin: commerce_adjustments
  uses_legacy_adjustments:
    plugin: default_value
    default_value: false
destination:
  plugin: entity:commerce_order_item
  destination_module: commerce_order
