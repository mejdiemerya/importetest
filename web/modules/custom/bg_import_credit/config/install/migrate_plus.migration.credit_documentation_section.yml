# Migration configuration for user accounts. We've described most of what goes
# into migration configuration in migrate_plus.migration.beer_term.yml, so won't
# repeat that here.
id: credit_documentation_section
label: credit_documentation_section
source:
  plugin: credit_documentation_section_node
destination:
  plugin: entity:node
process:
  type:
    plugin: default_value
    default_value: 'credit_documentation_section'
  title:
    plugin: skip_on_empty
    method: row
    source: title
  nid: nid
  uid: uid
  status: status
  created: created
  changed: changed
  field_credit_labels:
    plugin: get
    source: field_credit_labels_tid
  field_credits:
    plugin: get
    source: field_credits_tid
  field_documents:
    plugin: get
    source: field_documents_target_id
  'body/value':
    plugin: get
    source: body_value
  'body/summary':
    plugin: get
    source: body_summary
  'body/format':
    plugin: default_value
    default_value: 'full_html'
dependencies:
  enforced:
    module:
      - migrate_drupal
