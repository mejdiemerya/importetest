# Migration configuration for user accounts. We've described most of what goes
# into migration configuration in migrate_plus.migration.beer_term.yml, so won't
# repeat that here.
id: author
label: author
source:
  plugin: author_node
destination:
  plugin: entity:node
process:
  type:
    plugin: default_value
    default_value: 'author'
  title: title
  nid: nid
  uid: uid
  status: status
  created: created
  changed: changed

  'body/value':
    plugin: get
    source: title
  'body/format':
    plugin: default_value
    default_value: 'basic_html'



dependencies:
  enforced:
    module:
      - migrate_drupal
