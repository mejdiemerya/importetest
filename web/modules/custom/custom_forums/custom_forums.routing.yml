custom_forums.topic_add:
  path: '/topic/add'
  defaults:
    _controller: '\Drupal\custom_forums\Controller\TopicController::add'
    _title: 'Create a Topic'
  requirements:
    _access: 'TRUE'
custom_forums.site_settings:
  path: '/admin/custom_forums/site'
  defaults:
    _title: 'Paramétrage du site'
    _form: 'Drupal\custom_forums\Form\CustomForumsSettingsForm'
  requirements:
    _permission: 'access content'
custom_forums.membership_signup.form:
  path: '/signup'
  defaults:
    _form: 'Drupal\custom_forums\Form\MembershipBasicSignupForm'
    _title: 'Basic Membership Signup'
  requirements:
    _permission: 'access content'
