services:
  bg_product_cart.order_completed_subscriber:
    class: Drupal\bg_product_cart\EventSubscriber\OrderCompletedSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  bg_product_cart.add_to_cart_redirect_subscriber:
    class: Drupal\bg_product_cart\EventSubscriber\CommerceAddToCartRedirectSubscriber
    arguments: ['@current_user', '@request_stack']
    tags:
      - { name: event_subscriber }
  bg_product_cart.user_redirect_subscriber:
    class: Drupal\bg_product_cart\EventSubscriber\UserRedirectSubscriber
    arguments: [ '@current_user' ]
    tags:
      - { name: event_subscriber }

