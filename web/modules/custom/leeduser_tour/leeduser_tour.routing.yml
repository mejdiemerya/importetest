leeduser_tour.page:
  path: '/leeduser-tour'
  defaults:
    _controller: '\Drupal\leeduser_tour\Controller\LeeduserTourController::content'
    _title: 'Leeduser Tour'
  requirements:
    _permission: 'access content'
store.page:
  path: '/store'
  defaults:
    _controller: '\Drupal\leeduser_tour\Controller\LeeduserTourController::contentstore'
    _title: 'Store'
  requirements:
    _permission: 'access content'
